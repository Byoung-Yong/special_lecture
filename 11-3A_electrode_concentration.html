<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>전극 표면 농도 변화</title><style>body{font-family:Arial,'Malgun Gothic',sans-serif;background:white;color:#17212b;margin:0}main{max-width:1050px;margin:22px auto;padding:0 16px}h1{font-size:24px}.controls{display:flex;flex-wrap:wrap;gap:15px;align-items:center;margin:20px 0}button{padding:10px 16px;font-size:16px;background:white;border:1px solid #8995a0;border-radius:4px;cursor:pointer}label{display:flex;align-items:center;gap:8px;font-size:15px}input{accent-color:#1769a6}canvas{width:100%;height:auto;border:1px solid #d6dce1;display:block}output{min-width:55px}@media(max-width:600px){h1{font-size:21px}.controls{gap:12px}}</style></head><body><main><h1>전극 표면에서의 농도 변화</h1><div class="controls"><button id="play">▶ 재생</button><button id="reset">↺ 초기화</button><label>재생 속도 <input id="speed" type="range" min="0.05" max="2" step="0.05" value="0.25"><output id="speedValue">0.25×</output></label><label>확산계수 D (cm²/s) <input id="diff" type="range" min="0.000001" max="0.00003" step="0.000001" value="0.00001"><output id="diffValue">1.0×10⁻⁵</output></label><label><input id="area" type="checkbox"> 농도 면 표시</label></div><canvas id="plot" width="1000" height="590" aria-label="전극에서 거리에 따른 농도 변화 그래프"></canvas></main><script>
'use strict';
const get=id=>document.getElementById(id);
const canvas=get('plot'),ctx=canvas.getContext('2d');
const L=100,R=955,T=45,B=520,xmax=0.003;
let t=0,playing=false,last=0;
function X(x){return L+(R-L)*x/xmax}
function Y(y){return B-(B-T)*y}
function erf(x){const z=1/(1+0.3275911*Math.abs(x));const p=((((1.061405429*z-1.453152027)*z+1.421413741)*z-0.284496736)*z+0.254829592)*z;return Math.sign(x)*(1-p*Math.exp(-x*x))}
function text(str,x,y,size=17,align='center'){ctx.fillStyle='#24303a';ctx.font=size+'px Arial, sans-serif';ctx.textAlign=align;ctx.fillText(str,x,y)}
function draw(){const D=Number(get('diff').value);ctx.clearRect(0,0,1000,590);ctx.fillStyle='white';ctx.fillRect(0,0,1000,590);ctx.lineWidth=1;ctx.strokeStyle='#e1e7eb';for(let i=0;i<=6;i++){const x=X(i*xmax/6);ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,B);ctx.stroke();text((i*.5).toFixed(1),x,B+25,16)}for(let i=0;i<=5;i++){const y=i/5;ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(R,Y(y));ctx.stroke();text(y.toFixed(1),L-15,Y(y)+6,16,'right')}ctx.strokeStyle='#17212b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,B);ctx.lineTo(R,B);ctx.stroke();text('x (10⁻³ cm)',(L+R)/2,574,19);ctx.save();ctx.translate(30,(T+B)/2);ctx.rotate(-Math.PI/2);text('C(x,t) / C*',0,0,19);ctx.restore();text('전극 x = 0',L+5,T-15,16,'left');text('t = '+t.toFixed(4)+' s',R-5,T+28,22,'right');const points=[];for(let i=0;i<=450;i++){const x=i*xmax/450;const c=t===0?1:Math.max(0,Math.min(1,erf(x/(2*Math.sqrt(D*t)))));points.push([X(x),Y(c)])}ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(get('area').checked){ctx.lineTo(R,B);ctx.lineTo(L,B);ctx.closePath();ctx.fillStyle='rgba(20,110,190,.18)';ctx.fill()}if(!get('area').checked){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.strokeStyle='#1267a8';ctx.lineWidth=3.5;ctx.stroke();}get('speedValue').textContent=Number(get('speed').value).toFixed(2)+'×';get('diffValue').textContent=(D/1e-5).toFixed(1)+'×10⁻⁵'}
function frame(now){if(playing){if(last)t=Math.min(1,t+(now-last)/1000*Number(get('speed').value)*0.05);last=now;draw();if(t>=1){playing=false;get('play').textContent='▶ 재생';last=0}}requestAnimationFrame(frame)}
get('play').addEventListener('click',()=>{if(t>=1)t=0;playing=!playing;last=0;get('play').textContent=playing?'Ⅱ 일시정지':'▶ 재생';draw()});get('reset').addEventListener('click',()=>{playing=false;t=0;last=0;get('play').textContent='▶ 재생';draw()});['speed','diff','area'].forEach(id=>get(id).addEventListener('input',draw));draw();requestAnimationFrame(frame);
</script></body></html>
