<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>액체–액체 상분리 | 물리화학</title><style>
:root{font-family:Arial,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#192a37;background:white}*{box-sizing:border-box}body{margin:0}main{max-width:1460px;margin:auto;padding:26px 28px 44px}h1{margin:0 0 25px;font-size:29px;letter-spacing:-.045em}h2{font-size:16px;margin:0 0 14px;letter-spacing:-.02em}section{min-width:0}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:29px}.controls{border-right:1px solid #dae1e7;padding-right:25px}.control{margin:0 0 31px}label{font-size:14px;font-weight:650;display:flex;justify-content:space-between;align-items:baseline;gap:10px}output{font-size:21px;font-weight:750;font-variant-numeric:tabular-nums}input[type=range]{display:block;width:100%;margin:15px 0 6px;accent-color:#087c87}small{color:#687985;font-size:12px}button{font:inherit;font-size:13px;padding:8px 11px;border:1px solid #cad6db;background:white;border-radius:5px;cursor:pointer}.presets{display:flex;gap:6px;margin-bottom:26px}button:focus-visible,input:focus-visible{outline:2px solid #007e88;outline-offset:3px}.plots{display:grid;grid-template-columns:1fr 1fr;gap:28px}.chart{width:100%;aspect-ratio:1.17/1;display:block}.amount-panel{border-top:1px solid #dde5e9;padding-top:25px;margin-top:16px}.amounts{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.amounts .bar{display:flex;height:46px;width:min(100%,600px);border:1px solid #90a0a9;overflow:hidden}.amounts .bar>div{height:100%;display:flex;align-items:center;justify-content:center;min-width:0;transition:width .12s linear;font-variant-numeric:tabular-nums}.amounts .alpha{background:#bbdae9;color:#143747}.amounts .beta{background:#e8bd83;color:#563918}.amounts .single{background:#dce8eb;color:#243c46;width:100%}.legends{display:flex;flex-wrap:wrap;gap:20px;font-size:13px;margin:12px 0;color:#415363}.dot{display:inline-block;width:12px;height:12px;margin-right:7px;vertical-align:-1px}.numbers{display:flex;gap:24px;flex-wrap:wrap;font-size:14px}.numbers strong{font-size:18px;font-variant-numeric:tabular-nums}.numbers span{color:#5f7180;font-size:12px;display:block;margin-bottom:4px}.axis{fill:#546673;font-size:12px}.axis-title{fill:#2a3d4b;font-size:13px}.frame{stroke:#8797a0;stroke-width:1;fill:none}.guide{stroke:#94a4ae;stroke-width:1;stroke-dasharray:5 4}.plotline{fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.note{color:#6a7a85;font-size:12px;margin-top:18px}@media(max-width:950px){main{padding:20px 16px}.layout{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid #dde5e9;padding:0 0 15px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.presets{grid-column:1/-1;margin:0}.control{margin-bottom:8px}}@media(max-width:620px){h1{font-size:24px}.controls{grid-template-columns:1fr;gap:8px}.plots{grid-template-columns:1fr;gap:18px}.chart{aspect-ratio:1.3/1}.amounts .bar{width:100%}}
</style></head><body><main><h1>액체–액체 상분리</h1><div class="layout"><aside class="controls"><div class="presets"><button id="two" type="button">두 액체상</button><button id="one" type="button">한 액체상</button></div><div class="control"><label for="he">등몰 혼합 엔탈피 <output id="hv"></output></label><input id="he" type="range" min="-1" max="4" step="0.05" value="2"><small>kJ mol⁻¹ (x<sub>B</sub>=0.5)</small></div><div class="control"><label for="temperature">온도 <output id="tv"></output></label><input id="temperature" type="range" min="260" max="700" step="1" value="360"><small>K</small></div><div class="control"><label for="composition">전체 조성 <output id="zv"></output></label><input id="composition" type="range" min="0" max="1" step="0.01" value="0.54"><small>B의 전체 몰분율 z<sub>B</sub></small></div></aside><div><div class="plots"><section><h2>(a) 온도–조성</h2><svg id="phase" class="chart" viewBox="0 0 510 420" role="img" aria-label="온도 조성 공존곡선"></svg></section><section><h2>(b) 혼합 Gibbs 에너지</h2><svg id="gibbs" class="chart" viewBox="0 0 510 420" role="img" aria-label="혼합 Gibbs 에너지와 공통접선"></svg></section></div><section class="amount-panel"><h2>(c) 각 액체상의 몰수 분율</h2><div class="amounts"><div style="flex:1;min-width:210px"><div class="bar" id="bar" aria-label="각 액체상의 몰수분율"></div><div class="legends"><span><i class="dot" style="background:#bbdae9"></i>A가 풍부한 액체상</span><span><i class="dot" style="background:#e8bd83"></i>B가 풍부한 액체상</span></div></div><div class="numbers"><div><span>상태</span><strong id="state"></strong></div><div><span>첫 번째 상 x<sub>B</sub></span><strong id="xl"></strong></div><div><span>두 번째 상 x<sub>B</sub></span><strong id="xr"></strong></div><div><span>임계 온도</span><strong id="tc"></strong></div></div></div></section><p class="note">대칭 정규용액 모형 · 두 색상의 길이는 액체층 높이가 아닌 몰수 분율</p></div></div></main>
<script>
'use strict';
const R=8.314462618,NS='http://www.w3.org/2000/svg', $=id=>document.getElementById(id);
function node(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));parent.appendChild(e);return e}
function label(s,x,y,value,attr={}){const t=node('text',{x,y,...attr},s);t.textContent=value;return t}
function segment(s,x1,y1,x2,y2,attr={}){return node('line',{x1,y1,x2,y2,...attr},s)}
function poly(s,points,attr={}){return node('path',{d:points.map((v,i)=>(i?'L':'M')+v[0].toFixed(2)+' '+v[1].toFixed(2)).join(' '),...attr},s)}
function freeEnergy(x,T,om){const entropy=(x>0?x*Math.log(x):0)+(x<1?(1-x)*Math.log(1-x):0);return (R*T*entropy+om*x*(1-x))/1000}
// Symmetric regular solution: the two binodal compositions satisfy mu_A(alpha)=mu_A(beta)
// and mu_B(alpha)=mu_B(beta). Coexistence is x_left and 1-x_left.
function binodal(T,om){const chi=om/(R*T);if(!(chi>2))return null;let l=1e-14,h=.5;for(let i=0;i<100;i++){const m=(l+h)/2;const f=Math.log(m/(1-m))+chi*(1-2*m);if(f<0)l=m;else h=m}const x=(l+h)/2;return [x,1-x]}
function axes(s,xmin,xmax,ymin,ymax,xTitle,yTitle,xTicks,yTicks){const b={l:61,t:18,w:423,h:335};const X=x=>b.l+(x-xmin)/(xmax-xmin)*b.w,Y=y=>b.t+b.h-(y-ymin)/(ymax-ymin)*b.h;node('rect',{x:b.l,y:b.t,width:b.w,height:b.h,class:'frame'},s);for(const x of xTicks){segment(s,X(x),b.t+b.h,X(x),b.t+b.h+5,{stroke:'#71838f'});label(s,X(x),b.t+b.h+22,Number(x.toFixed(2)).toString(),{class:'axis','text-anchor':'middle'})}for(const y of yTicks){segment(s,b.l-5,Y(y),b.l,Y(y),{stroke:'#71838f'});label(s,b.l-9,Y(y)+4,y.toFixed(ymax-ymin<12?1:0),{class:'axis','text-anchor':'end'})}label(s,b.l+b.w/2,405,xTitle,{class:'axis-title','text-anchor':'middle'});label(s,18,b.t+b.h/2,yTitle,{class:'axis-title','text-anchor':'middle',transform:`rotate(-90 18 ${b.t+b.h/2})`});return {X,Y,b}}
function render(){const he=Number($('he').value),T=Number($('temperature').value),z=Number($('composition').value),om=4000*he,Tc=om>0?om/(2*R):null,co=binodal(T,om);const two=co!==null&&z>co[0]&&z<co[1];
$('hv').textContent=(he>0?'+':'')+he.toFixed(2);$('tv').textContent=T+' K';$('zv').textContent=z.toFixed(2);$('tc').textContent=Tc?Tc.toFixed(1)+' K':'—';$('state').textContent=two?'두 액체상':'한 액체상';$('xl').textContent=two?co[0].toFixed(3):'—';$('xr').textContent=two?co[1].toFixed(3):'—';
const p=$('phase');p.replaceChildren();const minT=250,maxT=Math.max(710,Tc?Math.ceil((Tc+30)/50)*50:0),ticks=[];for(let n=300;n<maxT;n+=100)ticks.push(n);const a=axes(p,0,1,minT,maxT,'B의 몰분율, xB','온도, K',[0,.25,.5,.75,1],ticks);
if(Tc>minT){const lim=Math.min(Tc,maxT);const left=[],right=[];for(let i=0;i<=260;i++){const tt=minT+(lim-minT)*i/260;const pair=binodal(tt,om);if(pair){left.push([a.X(pair[0]),a.Y(tt)]);right.push([a.X(pair[1]),a.Y(tt)])}}left.push([a.X(.5),a.Y(Tc)]);right.push([a.X(.5),a.Y(Tc)]);node('polygon',{points:left.concat([...right].reverse()).map(q=>q.join(',')).join(' '),fill:'#e5f2f5'},p);poly(p,left,{class:'plotline',stroke:'#0072B2'});poly(p,right,{class:'plotline',stroke:'#0072B2'});node('circle',{cx:a.X(.5),cy:a.Y(Tc),r:4,fill:'#0072B2'},p);if(Tc>minT+65)label(p,a.X(.5),a.Y(minT+(Tc-minT)*.55),'두 액체상',{class:'axis-title','text-anchor':'middle'})}
segment(p,a.X(0),a.Y(T),a.X(1),a.Y(T),{class:'guide'});if(co){for(const v of co)node('circle',{cx:a.X(v),cy:a.Y(T),r:4.5,fill:'#0072B2'},p);if(two)segment(p,a.X(co[0]),a.Y(T),a.X(co[1]),a.Y(T),{stroke:'#0072B2','stroke-width':2})}node('circle',{cx:a.X(z),cy:a.Y(T),r:6,fill:'#D55E00',stroke:'#fff','stroke-width':1.5},p);
const g=$('gibbs');g.replaceChildren();const pts=Array.from({length:501},(_,i)=>{const x=i/500;return [x,freeEnergy(x,T,om)]});const ys=pts.map(q=>q[1]),mn=Math.min(...ys),mx=Math.max(...ys),pad=Math.max(.2,(mx-mn)*.14),bottom=mn-pad,top=mx+pad,gy=Array.from({length:5},(_,i)=>bottom+(top-bottom)*i/4);const b=axes(g,0,1,bottom,top,'B의 몰분율, xB','ΔGmix, kJ/mol',[0,.25,.5,.75,1],gy);poly(g,pts.map(q=>[b.X(q[0]),b.Y(q[1])]),{class:'plotline',stroke:'#8150a5'});
if(co){const gco=freeEnergy(co[0],T,om);segment(g,b.X(co[0]),b.Y(gco),b.X(co[1]),b.Y(gco),{stroke:'#008276','stroke-width':2,'stroke-dasharray':'6 4'});for(const x of co)node('circle',{cx:b.X(x),cy:b.Y(gco),r:4.5,fill:'#008276'},g)}node('circle',{cx:b.X(z),cy:b.Y(freeEnergy(z,T,om)),r:5,fill:'#D55E00',stroke:'white','stroke-width':1.5},g);
const bar=$('bar');bar.replaceChildren();if(two){const beta=(z-co[0])/(co[1]-co[0]);const alpha=1-beta;const aa=document.createElement('div'),bb=document.createElement('div');aa.className='alpha';bb.className='beta';aa.style.width=(alpha*100)+'%';bb.style.width=(beta*100)+'%';aa.textContent=alpha>.11?(100*alpha).toFixed(1)+'%':'';bb.textContent=beta>.11?(100*beta).toFixed(1)+'%':'';bar.append(aa,bb);bar.setAttribute('aria-label',`첫 액체상 몰수분율 ${(alpha*100).toFixed(1)}%, 둘째 액체상 ${(beta*100).toFixed(1)}%`)}else{const single=document.createElement('div');single.className='single';single.textContent='한 액체상 · 100%';bar.append(single);bar.setAttribute('aria-label','단일 액체상 100%')}
window.__phaseResult={T,z,he,Tc,co,two,alpha:two?(co[1]-z)/(co[1]-co[0]):null,beta:two?(z-co[0])/(co[1]-co[0]):null};}
for(const id of ['he','temperature','composition'])$(id).addEventListener('input',render);$('two').addEventListener('click',()=>{$('he').value=2;$('temperature').value=360;$('composition').value=.54;render()});$('one').addEventListener('click',()=>{$('he').value=2;$('temperature').value=600;$('composition').value=.54;render()});render();
</script></body></html>
