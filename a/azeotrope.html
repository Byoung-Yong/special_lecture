<!doctype html>
<html lang="ko">
<head>

<title>혼합 엔탈피와 공비점 — 물리화학 실험실</title>
<style>
:root {--ink:#17232d;--muted:#667680;--line:#dce4e7;--panel:#fff;--bg:#f4f7f6;--blue:#166eaa;--orange:#d56b35;--purple:#9254a1;--teal:#0f766e;--alert:#995014;--alertbg:#fff4de}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family: -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Arial,sans-serif;font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #77c1e2;outline-offset:3px}
.header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:1510px;margin:auto;padding:29px clamp(20px,3vw,47px) 27px}.eyebrow{letter-spacing:.16em;text-transform:uppercase;color:#39716f;font-size:11px;font-weight:800}.header h1{font-size:clamp(25px,2.6vw,38px);line-height:1.3;letter-spacing:-.055em;margin:7px 0 8px;font-weight:760}.header p{margin:0;max-width:810px;color:#61717a;font-size:14px}.layout{max-width:1510px;margin:0 auto;display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;padding:26px clamp(20px,3vw,47px) 45px;align-items:start}
.sidebar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:21px 20px 18px;position:sticky;top:16px;box-shadow:0 1px 6px #21343c06}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}.section-head{font-weight:760;font-size:17px;letter-spacing:-.035em;margin:0}.tiny{font-size:12px;color:var(--muted)}.reset{color:#66737b;border:0;background:transparent;padding:4px 2px;text-decoration:underline;text-underline-offset:3px;font-size:12px}.sidebar h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#75838a;font-weight:750;margin:22px 0 10px}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.preset{border:1px solid #dae3e4;border-radius:8px;background:#fff;color:#25353d;min-height:42px;font-size:12px;font-weight:720;padding:5px 2px}.preset[aria-pressed="true"]{background:#133f4a;border-color:#133f4a;color:white}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label,.slide-label{font-size:12px;color:#485b65;font-weight:690}.unit-input{display:flex;align-items:stretch;position:relative}.unit-input input{width:100%;min-width:0;height:42px;border:1px solid #d5e0e3;border-radius:8px;background:#fcfdfd;padding:0 44px 0 11px;color:#182830;font-size:15px;font-weight:630}.unit-input input:hover{border-color:#9caeb6}.unit-input span{position:absolute;right:9px;top:11px;font-size:12px;color:#74848c;pointer-events:none}.wide{margin-top:13px}.numeric-highlight .unit-input input{border-color:#a6c2c3;background:#f6fbfa;font-size:17px}.slider-line{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:11px;color:#8a989f}.slider{width:100%;height:21px;accent-color:var(--teal);margin:3px 0 0;cursor:pointer}.divider{border:0;border-top:1px solid #e8eded;margin:19px 0 12px}.aux{border:1px solid #e6ebec;background:#f8faf9;border-radius:8px;padding:10px 11px;margin-top:15px}.aux .math{font-family:Georgia,"Times New Roman",serif;font-size:15px;color:#23414b}.aux .tiny{margin-top:5px;line-height:1.6}
.workspace{min-width:0}.result-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 13px}.result-header h2{font-size:18px;letter-spacing:-.035em;margin:0}.status{border:1px solid #d5e5e1;color:#166454;background:#f0f8f4;font-size:12px;border-radius:6px;padding:5px 9px;font-weight:700;white-space:nowrap}.status.warn{background:#fff5e8;border-color:#f0d7af;color:#9a561e}.plots-top{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chart{background:#fff;border:1px solid var(--line);border-radius:12px;min-width:0;overflow:hidden}.chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:15px 17px 0}.chart-head h3{font-weight:750;font-size:16px;letter-spacing:-.035em;margin:0}.chart-head p{margin:3px 0 0;color:#687980;font-size:12px}.chart-head .export{background:#fff;color:#66767f;font-size:11px;border:1px solid #dce4e7;padding:5px 8px;border-radius:6px;white-space:nowrap}.export:hover{background:#f3f8f8}.chart svg{display:block;width:100%;height:auto;aspect-ratio:640/410;overflow:visible}.chart.wide svg{aspect-ratio:1080/405}.chart-footer{padding:5px 17px 16px;color:#5a707b;font-size:12px;min-height:35px}.chart.wide{margin-top:16px}.wide-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:8px 0 0}.legend span{font-size:11px;color:#4b646c}.sw{display:inline-block;width:20px;height:0;vertical-align:middle;border-top:3px solid var(--blue);margin-right:5px}.sw.orange{border-top-color:var(--orange);border-top-style:dashed}.sw.dot{width:8px;height:8px;border:0;border-radius:50%;background:var(--ink)}.result-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:#fff;border-radius:12px;margin-top:16px;overflow:hidden}.metric{padding:15px 15px;border-right:1px solid var(--line);min-width:0}.metric:last-child{border-right:0}.metric span{display:block;color:#6f8189;font-size:11px;font-weight:680}.metric strong{display:block;margin-top:5px;font-size:18px;line-height:1.35;font-weight:760;letter-spacing:-.035em}.metric em{font-style:normal;font-size:11px;color:#829198;display:block;margin-top:3px}.warning{display:none;align-items:flex-start;gap:9px;border:1px solid #ecd5a9;border-radius:9px;background:var(--alertbg);color:#70471c;padding:11px 13px;margin-bottom:14px;font-size:13px}.warning.show{display:flex}.warning strong{font-weight:800}.reading{background:transparent;margin-top:24px;color:#38505a}.reading h3{font-size:15px;letter-spacing:-.02em;margin:0 0 8px}.reading p{color:#5b707a;font-size:13px;line-height:1.85;margin:0 0 9px}.reading code{font-size:12px;background:#e9eff0;border-radius:3px;padding:2px 4px}.formula{font-family:Georgia,"Times New Roman",serif;font-size:15px;letter-spacing:0;color:#2e4c58}.details{border-top:1px solid #dce6e7;padding-top:12px;margin-top:13px}.details summary{cursor:pointer;font-size:13px;font-weight:720;color:#38525e}.details p{margin-top:9px}svg text{font-family:Arial,"Malgun Gothic",sans-serif}.svg-label{fill:#425561;font-size:14px}.svg-note{fill:#7d8990;font-size:12px}.axis-num{font-size:13px;fill:#40535c}.gridline{stroke:#dce5e7;stroke-width:1}.chart-head button{flex:0 0 auto}@media(max-width:1150px){.layout{grid-template-columns:280px minmax(0,1fr);gap:16px}.plots-top{grid-template-columns:1fr}.chart svg{aspect-ratio:700/350}.chart.wide svg{aspect-ratio:800/410}.result-strip{grid-template-columns:repeat(2,1fr)}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}}@media(max-width:760px){.header-inner{padding:22px 17px}.layout{display:block;padding:17px 12px}.sidebar{position:static;padding:16px;margin-bottom:20px}.sidebar h3{margin-top:16px}.plots-top{gap:12px}.chart.wide{margin-top:12px}.chart-head{padding:14px 12px 0}.chart svg,.chart.wide svg{aspect-ratio:620/420}.chart-footer{padding:0 12px 12px}.result-strip{margin-top:12px}.metric{padding:12px}.metric strong{font-size:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
/* Focused lecture interface */
.header-inner{padding-top:17px;padding-bottom:13px}
.header h1{font-size:clamp(22px,2.2vw,30px);margin:0 0 4px}
.header .model-note{font-size:11px;color:#76858b;margin:0}
.layout{padding-top:16px;gap:18px}
.sidebar{padding:16px 17px;top:12px}
.sidebar h3{margin:15px 0 8px}
.plots-top{gap:12px}
.chart.wide{margin-top:12px}
.chart-head{padding:12px 15px 2px}
.chart-head h3{font-size:15px}
.chart.wide svg{aspect-ratio:1080/370}
.chart-footer{display:none}
.warning{margin-bottom:10px}
@media(max-width:760px){.header-inner{padding:15px 13px}.layout{padding:12px}.sidebar{margin-bottom:12px}}
</style>
</head>
<body>
<header class="header"><div class="header-inner">
  
  <h1>혼합 엔탈피와 공비점</h1>
  <p class="model-note">정규용액 모형 · 기준 압력 1 bar · 증발 엔탈피 A 40, B 42 kJ/mol (고정)</p>
</div></header>
<main class="layout">
<aside class="sidebar" aria-label="학생 조작 패널">
  <div class="topline"><h2 class="section-head">실험 조건</h2><button type="button" id="reset" class="reset">초기화</button></div>
  <h3>예시 조건</h3>
  <div class="presets" role="group" aria-label="혼합 엔탈피 예시">
    <button class="preset" type="button" data-preset="ideal" aria-pressed="false">이상용액</button>
    <button class="preset" type="button" data-preset="negative" aria-pressed="false">발열 혼합</button>
    <button class="preset" type="button" data-preset="positive" aria-pressed="true">흡열 혼합</button>
  </div>
  <h3>끓는점 (1 bar)</h3>
  <div class="two">
    <div class="field"><label for="tbA">A의 끓는점</label><div class="unit-input"><input id="tbA" type="number" min="-20" max="300" step="1" value="100"><span>°C</span></div></div>
    <div class="field"><label for="tbB">B의 끓는점</label><div class="unit-input"><input id="tbB" type="number" min="-20" max="300" step="1" value="110"><span>°C</span></div></div>
  </div>
  <h3>혼합 엔탈피 (kJ/mol)</h3>
  <div class="field numeric-highlight"><label for="mixH">등몰 혼합 엔탈피, hᴱ(0.5)</label><div class="unit-input"><input id="mixH" type="number" min="-4" max="4" step="0.05" value="1.20"><span>kJ/mol</span></div></div>
  <div class="slider-line"><span>−4 · 발열</span><span>+4 · 흡열</span></div>
  <input class="slider" id="mixHslider" aria-label="혼합 엔탈피 슬라이더" type="range" min="-4" max="4" step="0.05" value="1.2">
  <div hidden id="omegaText"></div>
  <!-- Fixed model parameters: retained for the equilibrium solver. -->
  <div hidden aria-hidden="true">
    <input id="hvA" type="number" value="40">
    <input id="hvB" type="number" value="42">
    <input id="pressure" type="number" value="1">
    <input id="xSelect" type="hidden" value="0.40">
    <span id="xSelected"></span>
  </div>
</aside>
<section class="workspace" aria-label="계산 결과">
  <div hidden><span id="status"></span></div>

  <div class="plots-top">
    <section class="chart"><div class="chart-head"><div><h3>(a) 이상용액 · 온도–조성</h3></div><button class="export" data-chart="ideal" type="button">PNG 저장</button></div><svg id="plotIdeal" viewBox="0 0 640 410" role="img" aria-label="이상용액의 기포점과 이슬점 온도-조성 상도표"></svg><div hidden id="idealFoot"></div></section>
    <section class="chart"><div class="chart-head"><div><h3>(b) 과잉 엔탈피</h3></div><button class="export" data-chart="enthalpy" type="button">PNG 저장</button></div><svg id="plotH" viewBox="0 0 640 410" role="img" aria-label="조성에 따른 혼합 엔탈피 그래프"></svg><div hidden id="enthalpyFoot"></div></section>
  </div>
  <section class="chart wide"><div class="chart-head wide-head"><div><h3>(c) 비이상 용액 · 온도–조성</h3><div class="legend"><span><i class="sw"></i>기포점 · 액체 조성</span><span><i class="sw orange"></i>이슬점 · 증기 조성</span><span><i class="sw dot"></i>공비점</span></div></div><button class="export" data-chart="actual" type="button">PNG 저장</button></div><svg id="plotActual" viewBox="0 0 1080 405" role="img" aria-label="활동도 계수에 따른 비이상 용액의 온도-조성 상도표"></svg><div hidden id="actualFoot"></div></section>
  <!-- Calculated readouts remain available to assistive logic, but are not shown. -->
  <div hidden aria-hidden="true">
    <span id="metX"></span><span id="metT"></span><span id="metTnote"></span>
    <span id="metY"></span><span id="metAzeo"></span><span id="metAzeoNote"></span>
    <span id="interpretation"></span>
  </div>
</section>
</main>
<script>
(()=>{
  'use strict';
  const R=8.314462618, NS='http://www.w3.org/2000/svg';
  const C={blue:'#166eaa',orange:'#d56b35',purple:'#9254a1',ink:'#17232d',muted:'#6d7d85',line:'#e0e9e9'};
  const ids=['tbA','tbB','mixH','mixHslider','hvA','hvB','pressure','xSelect'];
  const el=id=>document.getElementById(id);
  const fmt=(x,n=2)=>(Number.isFinite(x)?x.toFixed(n):'—');
  function parseInputs(){
    const p={};for(const id of ids){p[id]=Number(el(id).value);}
    if(ids.some(k=>!Number.isFinite(p[k])))throw Error('모든 입력값을 숫자로 입력하세요.');
    if(p.tbA< -20||p.tbA>300||p.tbB< -20||p.tbB>300)throw Error('끓는점은 −20~300 °C 범위에서 입력하세요.');
    if(p.hvA<10||p.hvA>100||p.hvB<10||p.hvB>100)throw Error('증발 엔탈피는 10~100 kJ/mol 범위에서 입력하세요.');
    if(p.mixH< -4||p.mixH>4)throw Error('등몰 혼합 엔탈피는 −4~+4 kJ/mol 범위에서 입력하세요.');
    if(p.pressure<0.05||p.pressure>5)throw Error('평형 압력은 0.05~5 bar 범위에서 입력하세요.');
    p.tA=p.tbA+273.15;p.tB=p.tbB+273.15;p.om=4000*p.mixH;p.tref=(p.tA+p.tB)/2;
    return p;
  }
  function vaporPressure(T,Tb,H_kJ){return Math.exp((H_kJ*1000/R)*(1/Tb-1/T));}
  function pressureAt(T,x,p,ideal=false){
    const omega=ideal?0:p.om;
    const ga=Math.exp(omega*(1-x)**2/(R*T));
    const gb=Math.exp(omega*x*x/(R*T));
    const a=x*ga*vaporPressure(T,p.tA,p.hvA);
    const b=(1-x)*gb*vaporPressure(T,p.tB,p.hvB);
    return {pressure:a+b,y:a/(a+b)};
  }
  function bubbleAt(x,p,ideal=false){
    let lo=Math.max(70,Math.min(p.tA,p.tB)-250),hi=Math.max(p.tA,p.tB)+350;
    let plo=pressureAt(lo,x,p,ideal).pressure,phi=pressureAt(hi,x,p,ideal).pressure;
    if(!(plo<p.pressure&&phi>p.pressure))return null;
    for(let i=0;i<65;i++){
      const t=(lo+hi)/2;
      if(pressureAt(t,x,p,ideal).pressure<p.pressure)lo=t; else hi=t;
    }
    const T=(lo+hi)/2;
    return {x,T,y:pressureAt(T,x,p,ideal).y};
  }
  function calcSeries(p,ideal=false){
    const res=[];for(let i=0;i<=200;i++){const point=bubbleAt(i/200,p,ideal);if(!point)return null;res.push(point);}return res;
  }
  function stable(series,p){
    if(p.om<=0)return true;
    // A sufficient condition for a fully miscible regular solution at each VLE temperature.
    return series.every(r=>p.om < 2*R*r.T-1e-6);
  }
  function azeoRoot(p){
    if(Math.abs(p.om)<1e-9)return null;
    const f=x=>{const q=bubbleAt(x,p);return q? q.y-x:NaN;};
    let lastX=0.0001,lastF=f(lastX);
    for(let i=1;i<=1000;i++){
      const x=0.0001+i*(0.9998/1000),fx=f(x);
      if(Number.isFinite(fx)&&Math.abs(fx)<1e-10&&Math.abs(f(Math.max(.000001,x-.001)))>1e-10)return bubbleAt(x,p);
      if(Number.isFinite(fx)&&Number.isFinite(lastF)&&fx*lastF<0){
        let a=lastX,b=x,fa=lastF;
        for(let j=0;j<52;j++){const c=(a+b)/2,fc=f(c);if(fc*fa>0){a=c;fa=fc;}else b=c;}
        const root=(a+b)/2;return bubbleAt(root,p);
      }
      lastX=x;lastF=fx;
    }return null;
  }
  function newEl(tag,attrs={},text){
    const n=document.createElementNS(NS,tag);
    for(const [key,val] of Object.entries(attrs)) n.setAttribute(key,String(val));
    if(text!==undefined)n.textContent=text;
    return n;
  }
  function add(svg,tag,attrs={},text){const n=newEl(tag,attrs,text);svg.appendChild(n);return n;}
  function drawPlotFrame(svg, box, xmin,xmax,ymin,ymax,yTicks,yUnit,xLab,opts={}){
    const {l,t,w,h}=box;
    const px=x=>l+(x-xmin)/(xmax-xmin)*w;
    const py=y=>t+h-(y-ymin)/(ymax-ymin)*h;
    add(svg,'rect',{x:l,y:t,width:w,height:h,fill:'#fff',stroke:'#83949c','stroke-width':1.3});
    const xTicks=[0,.25,.5,.75,1];
    for(let k=0;k<xTicks.length;k++){
      const v=xTicks[k],q=px(v);
      add(svg,'line',{x1:q,y1:t+h,x2:q,y2:t+h-6,stroke:C.ink,'stroke-width':1});
      add(svg,'line',{x1:q,y1:t,x2:q,y2:t+6,stroke:C.ink,'stroke-width':1});
      if(k===0||k===2||k===4)add(svg,'text',{x:q,y:t+h+24,'text-anchor':'middle',class:'axis-num'},fmt(v,k===2?1:0));
    }
    for(let k=0;k<yTicks.length;k++){
      const v=yTicks[k],q=py(v);
      if(opts.horizontalGrid&&k>0&&k<yTicks.length-1)add(svg,'line',{x1:l,y1:q,x2:l+w,y2:q,stroke:C.line,'stroke-width':.7});
      add(svg,'line',{x1:l,y1:q,x2:l+6,y2:q,stroke:C.ink,'stroke-width':1});
      add(svg,'line',{x1:l+w,y1:q,x2:l+w-6,y2:q,stroke:C.ink,'stroke-width':1});
      add(svg,'text',{x:l-10,y:q+4,'text-anchor':'end',class:'axis-num'},fmt(v,opts.yDecimals??1));
    }
    add(svg,'text',{x:l+w/2,y:t+h+50,'text-anchor':'middle',class:'svg-label'},xLab);
    add(svg,'text',{transform:`translate(${l-55} ${t+h/2}) rotate(-90)`,'text-anchor':'middle',class:'svg-label'},yUnit);
    return {px,py};
  }
  function path(data,px,py,xkey='x',ykey='T'){
    return data.map((q,i)=>(i===0?'M':'L')+px(q[xkey]).toFixed(2)+' '+py(q[ykey]).toFixed(2)).join(' ');
  }
  function triline(data,px,py){
    return path(data,px,py,'x')+' '+data.slice().reverse().map(q=>'L'+px(q.y).toFixed(2)+' '+py(q.T).toFixed(2)).join(' ')+' Z';
  }
  function getAxisRange(arrays){
    const v=arrays.flatMap(a=>a.map(r=>r.T));
    const lo=Math.min(...v), hi=Math.max(...v), pad=Math.max(2,(hi-lo)*.10);
    return [Math.floor((lo-pad)/5)*5,Math.ceil((hi+pad)/5)*5];
  }
  function lineChart(svgId,series,p,ideal,opts){
    const svg=el(svgId);svg.replaceChildren();svg.setAttribute('viewBox',opts.wide?'0 0 1080 405':'0 0 640 410');
    const wide=!!opts.wide, box=wide?{l:94,t:25,w:922,h:302}:{l:80,t:30,w:516,h:298};
    const [minT,maxT]=opts.range;const yTicks=[];for(let j=0;j<=4;j++)yTicks.push(minT+(maxT-minT)*j/4);
    const {px,py}=drawPlotFrame(svg,box,0,1,minT,maxT,yTicks,'Temperature, T / K','Mole fraction of A, xₐ or yₐ',{yDecimals:0});
    if(!series){
      add(svg,'text',{x:box.l+box.w/2,y:box.t+box.h/2,'text-anchor':'middle',fill:'#8a521c','font-size':17},'액체-액체 상분리');
      return;
    }
    if(ideal||stable(series,p)){
      add(svg,'path',{d:triline(series,px,py),fill:'#f4dec3','fill-opacity':'.36',stroke:'none','fill-rule':'evenodd'});
    }
    add(svg,'path',{d:path(series,px,py,'x'),fill:'none',stroke:C.blue,'stroke-width':2.6,'stroke-linejoin':'round'});
    add(svg,'path',{d:path(series,px,py,'y'),fill:'none',stroke:C.orange,'stroke-width':2.6,'stroke-dasharray':'7 4','stroke-linejoin':'round'});
    // Actual phase-equilibrium tie line at one selected liquid composition.
    const pt=bubbleAt(p.xSelect,p,ideal);
    if(pt){
      add(svg,'line',{x1:px(pt.x),y1:py(pt.T),x2:px(pt.y),y2:py(pt.T),stroke:'#697983','stroke-width':1.65,'stroke-dasharray':'5 4'});
      add(svg,'circle',{cx:px(pt.x),cy:py(pt.T),r:5.1,fill:C.blue,stroke:'#fff','stroke-width':1.2});
      add(svg,'circle',{cx:px(pt.y),cy:py(pt.T),r:5.1,fill:C.orange,stroke:'#fff','stroke-width':1.2});
      if(opts.wide){
        let lx=Math.max(box.l+30,Math.min(box.l+box.w-150,px(pt.x)-44)), ly=Math.max(box.t+24,py(pt.T)-16);
        add(svg,'text',{x:lx,y:ly,fill:C.muted,'font-size':13},'xₐ = '+fmt(pt.x)+'   yₐ = '+fmt(pt.y));
      }
    }
    if(!ideal && opts.azeo){
      const az=opts.azeo;
      add(svg,'line',{x1:px(az.x),y1:py(minT),x2:px(az.x),y2:py(az.T),stroke:'#6a6870','stroke-width':1.25,'stroke-dasharray':'4 5'});
      add(svg,'circle',{cx:px(az.x),cy:py(az.T),r:6.7,fill:C.ink,stroke:'#fff','stroke-width':1.6});
      const above=az.T<(minT+maxT)/2;
      add(svg,'text',{x:px(az.x),y:py(az.T)+(above?-15:24),'text-anchor':'middle',fill:C.ink,'font-size':14,'font-weight':700},'azeotrope');
    }
    const expl=wide?['Liquid','Vapor']:['Liquid','Vapor'];
    // Direct region labels placed at safe edges to avoid crossings.
    add(svg,'text',{x:px(.06),y:py(minT+.11*(maxT-minT)),fill:C.muted,'font-size':13},expl[0]);
    add(svg,'text',{x:px(.83),y:py(minT+.89*(maxT-minT)),fill:C.muted,'font-size':13},expl[1]);
  }
  function enthalpyChart(p){
    const svg=el('plotH');svg.replaceChildren();
    const box={l:81,t:30,w:515,h:298};
    const mid=p.mixH;
    const half=Math.max(1, Math.ceil(Math.abs(mid)*1.3*2)/2);
    const lo=-half,hi=half;
    const ticks=[-half,-half/2,0,half/2,half];
    const {px,py}=drawPlotFrame(svg,box,0,1,lo,hi,ticks,'Molar excess enthalpy, hᴱ / kJ mol⁻¹','Mole fraction of A, xₐ',{yDecimals:2});
    add(svg,'line',{x1:px(0),y1:py(0),x2:px(1),y2:py(0),stroke:'#80969e','stroke-width':1.15,'stroke-dasharray':'4 5'});
    const data=[];for(let i=0;i<=200;i++){const x=i/200;data.push({x,h:4*mid*x*(1-x)});}
    if(Math.abs(mid)>1e-8){
      add(svg,'path',{d:path(data,px,py,'x','h')+' L'+px(1)+' '+py(0)+' L'+px(0)+' '+py(0)+' Z',fill:mid>0?'#f9e3d9':'#e6e0f4','fill-opacity':'.8'});
    }
    add(svg,'path',{d:path(data,px,py,'x','h'),fill:'none',stroke:C.purple,'stroke-width':2.9});
    add(svg,'circle',{cx:px(.5),cy:py(mid),r:5.3,fill:C.purple,stroke:'#fff','stroke-width':1.4});
    add(svg,'text',{x:px(.5),y:py(mid)+(mid>0?-12:21),'text-anchor':'middle',fill:C.purple,'font-size':15,'font-weight':700},(mid>0?'+':'')+fmt(mid)+' kJ/mol');
    add(svg,'line',{x1:px(p.xSelect),y1:py(0),x2:px(p.xSelect),y2:py(4*mid*p.xSelect*(1-p.xSelect)),stroke:'#6b7d87','stroke-dasharray':'3 4','stroke-width':1.1});
  }
  function setWarnings(lines){
    // Keep the screen focused on plots. Phase separation is labeled in (c).
    const status=el('status');
    status.textContent=lines.length?'계산 조건 확인 필요':'계산 완료';
  }
  let timer=null;
  function render(){
    try{
      const p=parseInputs();el('mixHslider').value=String(p.mixH);
      el('xSelected').innerHTML='x<sub>A</sub> = '+fmt(p.xSelect);
      const xi=p.om/(R*p.tref);
      el('omegaText').innerHTML='Ω = '+(p.om>0?'+':'')+fmt(p.om/1000)+' kJ/mol · ξ<sub>ref</sub> = '+(xi>0?'+':'')+fmt(xi)+' (T<sub>ref</sub>='+fmt(p.tref,1)+' K)';
      let ideal=calcSeries(p,true), real=calcSeries(p,false), notes=[];
      if(!ideal||!real)throw Error('현재 조건에서 온도 해를 찾지 못했습니다. 입력 범위를 조정해 주세요.');
      const isStable=stable(real,p);
      if(!isStable){notes.push('액체-액체 상분리');}
      let az=isStable?azeoRoot(p):null;
      const range=getAxisRange([ideal,real]);
      lineChart('plotIdeal',ideal,p,true,{range});
      enthalpyChart(p);
      lineChart('plotActual',isStable?real:null,p,false,{range,wide:!window.matchMedia('(max-width:760px)').matches,azeo:az});
      setWarnings(notes);
      const idealPt=bubbleAt(p.xSelect,p,true), pt=bubbleAt(p.xSelect,p,false);
      el('idealFoot').textContent='선택 조성에서 T = '+fmt(idealPt.T)+' K, yₐ = '+fmt(idealPt.y)+'.';
      el('enthalpyFoot').textContent='전 범위의 최대 절댓값은 등몰 조성(xₐ = 0.5)에서 '+fmt(Math.abs(p.mixH))+' kJ/mol입니다.';
      el('metX').innerHTML='x<sub>A</sub> = '+fmt(p.xSelect);
      if(isStable){
        el('metT').textContent=fmt(pt.T)+' K';el('metTnote').textContent=fmt(pt.T-273.15)+' °C · '+fmt(p.pressure)+' bar';
        el('metY').innerHTML='y<sub>A</sub> = '+fmt(pt.y);
        el('metAzeo').textContent=az?'공비점 있음':'공비점 없음';
        el('metAzeoNote').textContent=az?'xₐ = '+fmt(az.x,3)+' · T = '+fmt(az.T,2)+' K':'설정 범위의 단일 액체 기액 평형';
        const kind=az?(p.om>0?'최소':'최대'):null;
        el('actualFoot').textContent=az?'공비점: xₐ = yₐ = '+fmt(az.x,3)+', T = '+fmt(az.T,2)+' K ('+kind+' 끓는점).':'내부 공비점이 계산되지 않았습니다. 비이상적이라고 항상 공비점이 생기지는 않습니다.';
        el('interpretation').textContent=p.mixH===0?'혼합 엔탈피가 0이므로 (a)와 (c)의 곡선이 일치합니다. 두 순수 성분의 증기압 차이만으로 액체와 증기의 조성이 달라집니다.':az?'현재 조건에서는 '+(p.mixH>0?'흡열 혼합으로 혼합물의 증기압이 상대적으로 증가하고, 순수 성분보다 낮은 온도에서 끓는 공비점':'발열 혼합으로 혼합물의 증기압이 상대적으로 감소하고, 순수 성분보다 높은 온도에서 끓는 공비점')+'이 계산됩니다. 이 점에서는 액체와 증기의 조성이 같아(xₐ=yₐ) 일반적인 분별 증류로 그 조성을 넘어 분리할 수 없습니다.':'활동도 계수가 이상용액과 다르더라도 공비점이 반드시 생기는 것은 아닙니다. 공비점 형성은 순수 성분 증기압 차이와 혼합물 비이상성의 상대적인 크기로 결정됩니다.';
      }else{
        el('metT').textContent='표시 보류';el('metTnote').textContent='액체 상분리 가능';el('metY').textContent='—';el('metAzeo').textContent='판정 보류';el('metAzeoNote').textContent='균일 액체 가정 불성립';
        el('actualFoot').textContent='액체–액체 평형을 포함하는 별도 모형이 필요합니다.';
        el('interpretation').textContent='큰 양의 혼합 엔탈피는 액체가 두 상으로 분리되는 경향을 만들 수 있습니다. 이때 단일 균일 액체의 기액 평형선과 공비점을 그대로 계산하면 잘못된 해석이 됩니다.';
      }
      document.querySelectorAll('.preset').forEach(b=>{
        const v={ideal:0,negative:-1.20,positive:1.20}[b.dataset.preset];
        b.setAttribute('aria-pressed',Math.abs(v-p.mixH)<.001?'true':'false');
      });
    }catch(err){setWarnings([err.message]);}
  }
  function setValue(id,val){el(id).value=String(val);}
  function renderSoon(){clearTimeout(timer);timer=setTimeout(render,20);}
  document.querySelectorAll('input').forEach(input=>input.addEventListener('input',e=>{
    if(e.target.id==='mixHslider')setValue('mixH',e.target.value);
    if(e.target.id==='mixH')setValue('mixHslider',e.target.value);
    renderSoon();
  }));
  document.querySelectorAll('[data-preset]').forEach(btn=>btn.addEventListener('click',()=>{
    const presets={ideal:0,negative:-1.20,positive:1.20};setValue('mixH',presets[btn.dataset.preset]);setValue('mixHslider',presets[btn.dataset.preset]);render();
  }));
  el('reset').addEventListener('click',()=>{
    for(const [k,v] of Object.entries({tbA:100,tbB:110,mixH:1.2,mixHslider:1.2,hvA:40,hvB:42,pressure:1,xSelect:.4}))setValue(k,v);
    render();
  });
  // Export real SVG-rendered curves to PNG without external libraries or services.
  document.querySelectorAll('[data-chart]').forEach(b=>b.addEventListener('click',()=>{
    const map={ideal:'plotIdeal',enthalpy:'plotH',actual:'plotActual'},src=el(map[b.dataset.chart]);
    const copy=src.cloneNode(true);copy.setAttribute('xmlns',NS);
    const vb=copy.getAttribute('viewBox').split(' ').map(Number),w=vb[2],h=vb[3];
    const bg=newEl('rect',{x:0,y:0,width:w,height:h,fill:'#fff'});copy.insertBefore(bg,copy.firstChild);
    const style=newEl('style');style.textContent='.svg-label{fill:#425561;font-size:14px}.svg-note{fill:#7d8990;font-size:12px}.axis-num{font-size:13px;fill:#40535c}text{font-family:Arial,sans-serif}';copy.insertBefore(style,copy.firstChild);
    const xml=new XMLSerializer().serializeToString(copy);
    const blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();
    img.onload=()=>{const canv=document.createElement('canvas');canv.width=w*3;canv.height=h*3;const ctx=canv.getContext('2d');ctx.scale(3,3);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);canv.toBlob(out=>{if(!out)return;const u=URL.createObjectURL(out),a=document.createElement('a');a.href=u;a.download='azeotrope_'+b.dataset.chart+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);},'image/png');};
    img.onerror=()=>{URL.revokeObjectURL(url);alert('PNG 변환을 완료하지 못했습니다.');};img.src=url;
  }));
  window.addEventListener('resize',renderSoon);
  render();
})();
</script>
</body>
</html>
