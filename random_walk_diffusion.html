<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Walk → Diffusion | Interactive Lecture</title><style>
:root{color-scheme:dark;--bg:#101820;--panel:#17232d;--line:#30404c;--text:#f1f5f4;--muted:#a7b7bd;--cyan:#5ed4ef;--orange:#ffbd75;--green:#a7e6b0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,'Noto Sans KR',sans-serif}main{max-width:1320px;margin:auto;padding:28px 26px 44px}header{border-bottom:1px solid var(--line);padding-bottom:18px}h1{font-size:clamp(25px,3vw,38px);letter-spacing:-.035em;margin:0}header small{color:var(--muted)}.lead{color:var(--muted);line-height:1.65;margin:13px 0 24px}.layout{display:grid;grid-template-columns:1.08fr 1fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);padding:20px;min-width:0}.panel h2{font-size:18px;margin:0 0 14px}.sub{font-size:13px;color:var(--muted);margin:0 0 12px}canvas{display:block;width:100%;height:auto;background:#0e1922;border:1px solid #293946}#walk{aspect-ratio:1.55}#density{aspect-ratio:1.55}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:18px 0}.controls button,.controls select{background:#223644;color:white;border:1px solid #526774;padding:11px 16px;font-size:14px;cursor:pointer}.controls button:hover{background:#2c4a59}.controls button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.primary{background:#17687c!important;border-color:#53a6b8!important}.controls label{color:var(--muted);font-size:14px}.controls input{accent-color:var(--cyan)}.readouts{display:flex;flex-wrap:wrap;gap:20px;color:var(--muted);font-size:14px;margin-bottom:15px}.readouts strong{color:var(--text);font-variant-numeric:tabular-nums}.note{font-size:14px;line-height:1.8;color:#d0dce0;border-left:3px solid var(--cyan);padding-left:15px;margin-top:20px}.formula{font-family:Georgia,serif;font-size:19px;color:#e6f4f7}.footer{font-size:12px;color:var(--muted);line-height:1.7;margin-top:20px}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.dot.a{background:var(--cyan)}.dot.b{background:var(--orange)}@media(max-width:850px){.layout{grid-template-columns:1fr}main{padding:18px 12px}header{display:block}header small{display:block;margin-top:8px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><main><header><h1>무작위 걸음에서 확산으로</h1></header><div class="controls"><button id="play" class="primary">▶ 재생</button><button id="step">한 단계 →</button><button id="reset">↺ 초기화</button><label for="speed">속도</label><input id="speed" type="range" min="1" max="12" value="4"><label for="view">표시</label><select id="view"><option value="both">이산 분포 + 연속 근사</option><option value="discrete">이산 분포만</option><option value="continuous">연속 근사만</option></select></div><div class="readouts"><span>걸음 수 <strong id="n">0</strong></span><span>시간 <strong id="t">0.00</strong> s</span><span>표준편차 <strong id="sigma">0.00</strong> cm</span><span>확산계수 <strong>D = 0.50 cm²/s</strong></span></div><section class="layout"><div class="panel"><h2>01 / 이산 무작위 걸음</h2><canvas id="walk" width="850" height="550" aria-label="파스칼 삼각형 형태로 전개되는 무작위 걸음 확률 분포"></canvas><div class="legend"><span><i class="dot a"></i>현재 위치별 확률</span></div></div><div class="panel"><h2>02 / 농도 분포의 확산</h2><canvas id="density" width="850" height="550" aria-label="시간에 따라 퍼지는 이산 확률과 가우스 확산 분포"></canvas><div class="legend"><span><i class="dot a"></i>이산 확률 (막대)</span><span><i class="dot b"></i>연속 확산 해 (곡선)</span></div></div></section></main><script>
(()=>{'use strict';const walk=document.getElementById('walk'),dens=document.getElementById('density'),wc=walk.getContext('2d'),dc=dens.getContext('2d');const l=.2,dt=.04,D=l*l/(2*dt),maxN=100;let n=0,running=false,last=0,carry=0;const $=id=>document.getElementById(id);const colors={cyan:'#5ed4ef',orange:'#ffbd75',grid:'#334652',muted:'#a7b7bd',text:'#f1f5f4'};function line(c,x1,y1,x2,y2,color,width=1){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}function txt(c,s,x,y,size=17,color=colors.muted,align='center'){c.fillStyle=color;c.font=`${size}px system-ui,sans-serif`;c.textAlign=align;c.fillText(s,x,y)}function probs(k){let p=[1];for(let i=0;i<k;i++){const q=Array(p.length+1).fill(0);p.forEach((v,j)=>{q[j]+=v*.5;q[j+1]+=v*.5});p=q}return p}function axes(c,w,h,x0,x1,y0,y1){line(c,x0,y1,x1,y1,colors.grid,2);line(c,(x0+x1)/2,y0,(x0+x1)/2,y1,colors.grid,1);}
function drawWalk(){const c=wc,w=walk.width,h=walk.height;c.clearRect(0,0,w,h);const left=70,right=w-45,top=68,bottom=h-55;const levels=Math.min(n,8),ys=k=>top+(bottom-top)*k/8,xs=(k,j)=>w/2+(2*j-k)*39;for(let k=0;k<=8;k++){const y=ys(k);line(c,left,y,right,y,colors.grid,1);txt(c,String(k),34,y+6,16)}for(let k=0;k<8;k++){for(let j=0;j<=k;j++){const x=xs(k,j),y=ys(k);line(c,x,y,xs(k+1,j),ys(k+1),k<levels?'#446e7c':'#2b3d48',k<levels?2:1);line(c,x,y,xs(k+1,j+1),ys(k+1),k<levels?'#446e7c':'#2b3d48',k<levels?2:1)}}for(let k=0;k<=8;k++){const ps=probs(k);for(let j=0;j<=k;j++){const x=xs(k,j),y=ys(k),active=k<=levels;c.beginPath();c.arc(x,y,active?Math.max(5,Math.sqrt(ps[j])*18):3,0,Math.PI*2);c.fillStyle=active?colors.cyan:'#3c5561';c.fill();if(active&&k<=5)txt(c,String(Math.round(ps[j]*2**k)),x,y-18,15,colors.text)}}if(n>8){txt(c,`처음 8단계 표시 · 현재 n = ${n}`,w/2,h-16,16,colors.orange)}else{txt(c,'',w/2,h-16,15)} }
function drawDensity(){const c=dc,w=dens.width,h=dens.height;c.clearRect(0,0,w,h);const L=75,R=w-38,T=48,B=h-76;const xMin=-3,xMax=3,yMax=2.1;const xx=x=>L+(x-xMin)/(xMax-xMin)*(R-L),yy=y=>B-y/yMax*(B-T);for(let k=-3;k<=3;k++){const x=xx(k);line(c,x,T,x,B,colors.grid,.7);txt(c,String(k),x,B+29,16)}for(let k=0;k<=2;k+=.5){const y=yy(k);line(c,L,y,R,y,colors.grid,.7);txt(c,k===0?'0':k.toFixed(1),L-10,y+5,13,colors.muted,'right')}line(c,L,B,R,B,'#91a7af',2);txt(c,'x / cm',R,B+55,16,colors.text,'right');txt(c,'ρ(x,t) / cm⁻¹',L,T-20,16,colors.text,'left');if(n===0){line(c,xx(0),B,xx(0),T+35,colors.orange,4);txt(c,'δ(x) · t = 0',xx(0)+18,T+35,17,colors.orange,'left');return}const t=n*dt,mode=$('view').value;if(mode!=='discrete'){c.strokeStyle=colors.orange;c.lineWidth=3;c.beginPath();for(let i=0;i<=700;i++){const x=xMin+(xMax-xMin)*i/700,p=Math.exp(-x*x/(4*D*t))/Math.sqrt(4*Math.PI*D*t);i===0?c.moveTo(xx(x),yy(p)):c.lineTo(xx(x),yy(p))}c.stroke()}if(mode!=='continuous'){const ps=probs(n),width=(R-L)*2*l/(xMax-xMin);for(let j=0;j<=n;j++){const x=(2*j-n)*l;if(x<xMin||x>xMax)continue;const p=ps[j]/(2*l),px=xx(x);c.fillStyle='rgba(94,212,239,.65)';c.fillRect(px-width*.43,yy(p),width*.86,B-yy(p));}}txt(c,`t = ${t.toFixed(2)} s`,R-8,T+24,21,colors.text,'right')}
function draw(){ $('n').textContent=n;$('t').textContent=(n*dt).toFixed(2);$('sigma').textContent=(l*Math.sqrt(n)).toFixed(2);drawWalk();drawDensity()}function setRun(v){running=v;$('play').textContent=v?'Ⅱ 일시정지':'▶ 재생'}$('play').onclick=()=>setRun(!running);$('step').onclick=()=>{setRun(false);n=Math.min(maxN,n+1);draw()};$('reset').onclick=()=>{setRun(false);n=0;carry=0;draw()};$('view').onchange=draw;function tick(ts){if(!last)last=ts;const elapsed=Math.min(100,ts-last);last=ts;if(running){carry+=elapsed;const interval=400/Number($('speed').value);while(carry>=interval&&n<maxN){carry-=interval;n++}if(n===maxN)setRun(false);draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick)})();</script></body></html>
