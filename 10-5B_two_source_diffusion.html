<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>두 지점 확산</title><style>body{margin:0;background:#101820;color:#edf2f5;font-family:Arial,'Malgun Gothic',sans-serif}main{max-width:1250px;margin:auto;padding:22px}h1{font-size:29px;margin:0 0 18px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}button{font-size:17px;padding:10px 20px;background:#263a47;color:white;border:1px solid #6c8796;cursor:pointer}button:hover{background:#355465}input{accent-color:#5ccdf3}input[type=range]{width:150px}.panel{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:15px 0}.source{border:1px solid #405260;padding:16px}.source h2{margin:0 0 13px;font-size:21px}.source.a h2{color:#5ccdf3}.source.b h2{color:#ff9a65}.field{display:grid;grid-template-columns:115px 1fr 75px;gap:12px;align-items:center;margin:12px 0;font-size:17px}output{text-align:right;font-variant-numeric:tabular-nums}.display-options{display:flex;flex-wrap:wrap;gap:22px;align-items:center;margin:0 0 14px;font-size:17px}.display-options label{display:inline-flex;align-items:center;gap:8px;cursor:pointer}.display-options input{width:18px;height:18px}canvas{display:block;width:100%;height:auto;background:#0b141b;border:1px solid #405260}#time{font-size:20px;min-width:130px}@media(max-width:750px){.panel{grid-template-columns:1fr}.field{grid-template-columns:90px 1fr 68px}input[type=range]{width:100%}}</style></head><body><main><h1>두 지점에서의 확산</h1><div class="controls"><button id="play">▶ 재생</button><button id="reset">↺ 초기화</button><label>재생 속도 <input id="speed" type="range" min="0.02" max="1" step="0.02" value="0.12"></label><output id="speedOut">0.12×</output><span id="time">t = 0.00 s</span></div><div class="panel"><section class="source a"><h2>A · 파란색</h2><div class="field"><label for="aMass">초기 농도</label><input id="aMass" type="range" min="0.1" max="5" step="0.1" value="2"><output id="aMassOut"></output></div><div class="field"><label for="aD">확산계수 D</label><input id="aD" type="range" min="0.01" max="1" step="0.01" value="0.18"><output id="aDOut"></output></div><div class="field"><label for="aX">초기 위치 x</label><input id="aX" type="range" min="0" max="5" step="0.1" value="1.5"><output id="aXOut"></output></div></section><section class="source b"><h2>B · 주황색</h2><div class="field"><label for="bMass">초기 농도</label><input id="bMass" type="range" min="0.1" max="5" step="0.1" value="4"><output id="bMassOut"></output></div><div class="field"><label for="bD">확산계수 D</label><input id="bD" type="range" min="0.01" max="1" step="0.01" value="0.35"><output id="bDOut"></output></div><div class="field"><label for="bX">초기 위치 x</label><input id="bX" type="range" min="0" max="5" step="0.1" value="3.5"><output id="bXOut"></output></div></section></div><div class="display-options"><label><input id="areaIndividual" type="checkbox"> A, B 농도를 면으로 표시</label><label><input id="areaTotal" type="checkbox"> 전체 농도를 면으로 표시 (A + B)</label></div><canvas id="plot" width="1200" height="600" aria-label="시간에 따른 A와 B의 농도 분포"></canvas></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('plot'),ctx=canvas.getContext('2d');let t=0,playing=false,last=null;const ids=['aMass','aD','aX','bMass','bD','bX'];function vals(){let o={};for(const id of ids){o[id]=Number($(id).value);$(id+'Out').textContent=o[id].toFixed(id.endsWith('D')?2:1)}return o}function density(x,m,d,x0){const variance=0.035+2*d*t;return m/Math.sqrt(2*Math.PI*variance)*Math.exp(-((x-x0)**2)/(2*variance))}function draw(){const v=vals(),W=1200,H=600,L=95,R=45,T=40,B=72,w=W-L-R,h=H-T-B;ctx.clearRect(0,0,W,H);const xpx=x=>L+x/5*w;const maxY=Math.max(2.5,v.aMass/Math.sqrt(2*Math.PI*.035),v.bMass/Math.sqrt(2*Math.PI*.035))*1.08;const ypx=y=>T+h-y/maxY*h;ctx.strokeStyle='#2a3e4a';ctx.lineWidth=1;ctx.font='18px Arial';ctx.fillStyle='#b9cbd5';for(let x=0;x<=5;x+=1){let px=xpx(x);ctx.beginPath();ctx.moveTo(px,T);ctx.lineTo(px,T+h);ctx.stroke();ctx.fillText(x.toString(),px-10,T+h+28)}for(let j=0;j<=5;j++){let y=maxY*j/5,py=ypx(y);ctx.beginPath();ctx.moveTo(L,py);ctx.lineTo(L+w,py);ctx.stroke();ctx.fillText(y.toFixed(1),L-58,py+6)}ctx.strokeStyle='#e4ecf1';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,T+h);ctx.lineTo(L+w,T+h);ctx.stroke();ctx.fillStyle='#e4ecf1';ctx.font='22px Arial';ctx.fillText('Concentration',L+8,28);ctx.fillText('x',W-40,H-22);function curve(m,d,x0,color,fill){ctx.beginPath();for(let i=0;i<=1000;i++){const x=i*.005,y=density(x,m,d,x0),px=xpx(x),py=ypx(y);i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}if(fill){ctx.lineTo(xpx(5),ypx(0));ctx.lineTo(xpx(0),ypx(0));ctx.closePath();ctx.fillStyle=color;ctx.fill()}else{ctx.strokeStyle=color;ctx.lineWidth=4;ctx.stroke();ctx.fillStyle=color;ctx.beginPath();ctx.arc(xpx(x0),ypx(density(x0,m,d,x0)),6,0,Math.PI*2);ctx.fill()}}if($('areaTotal').checked){ctx.beginPath();for(let i=0;i<=1000;i++){const x=i*.005,y=density(x,v.aMass,v.aD,v.aX)+density(x,v.bMass,v.bD,v.bX);i===0?ctx.moveTo(xpx(x),ypx(y)):ctx.lineTo(xpx(x),ypx(y))}ctx.lineTo(xpx(5),ypx(0));ctx.lineTo(xpx(0),ypx(0));ctx.closePath();ctx.fillStyle='rgba(168,224,130,0.32)';ctx.fill();ctx.strokeStyle='#b1e68d';ctx.lineWidth=2;ctx.stroke()}const filled=$('areaIndividual').checked;curve(v.aMass,v.aD,v.aX,filled?'rgba(92,205,243,0.40)':'#5ccdf3',filled);curve(v.bMass,v.bD,v.bX,filled?'rgba(255,154,101,0.40)':'#ff9a65',filled);$('time').textContent='t = '+t.toFixed(2)+' s';$('speedOut').textContent=Number($('speed').value).toFixed(2)+'×'}function frame(ts){if(last===null)last=ts;let dt=Math.min((ts-last)/1000,.1);last=ts;if(playing){t+=dt*Number($('speed').value);draw()}requestAnimationFrame(frame)}$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Ⅱ 일시정지':'▶ 재생'};$('reset').onclick=()=>{t=0;playing=false;$('play').textContent='▶ 재생';draw()};ids.forEach(id=>$(id).addEventListener('input',draw));$('speed').addEventListener('input',draw);$('areaIndividual').addEventListener('change',draw);$('areaTotal').addEventListener('change',draw);draw();requestAnimationFrame(frame)})();
</script></body></html>
